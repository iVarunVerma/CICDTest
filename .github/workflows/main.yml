name: Manual Dispatch Test

on:
  push:
    branches:
      - development
  workflow_dispatch:
    inputs:  
      environment:  
        type: environment  
        description: 'Environment to use'  
        default: 'development'  
        required: true  
      branch:  
        type: choice  
        description: 'Branch to use'  
        required: true  
        default: 'staging'  
        options:
          - development  
          - staging  
          - main  
      branch_override:  
        type: string  
        description: 'option to deploy a specific tag, branch, or feature'
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || github.ref_name }}
    steps:
      - name: Branch name
        run: echo "This exists in main branch"
      
      - name: Github Context
        run: echo "Github event name ${{ github.event_name }} and ${{ github.event.inputs.environment }} and ${{ github.ref_name }}"

      - name: Debug - Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
        
      - name: Echo a secret
        env:
          APIKey: ${{ secrets.APIKEY }}
        run: |
          echo "The local var length is ${#APIKey}"
          echo "The secret is ${{ secrets.APIKEY }}"

      - name: Echo a vars
        run: echo "The vars is ${{ vars.APIURL }}"
      
      - name: Repo variable
        run: echo " Job name repo var ${{ vars.JOB_NAME }}"

      - name: Servers
        shell: pwsh
        run: |
          # Convert JSON string to object array
          $servers = ${{ vars.SERVERS }} | ConvertFrom-Json

          foreach ($s in $servers) {
              Write-Host "Service: $($s.Name) on $($s.Server)"

              $instances = ${{ vars.INSTANCES }} | ConvertFrom-Json

              foreach ($i in $instances) {
                Write-Host "ServiceName: $($i.ServiceName), $($i.DisplayName) and $($i.ServiceDescription) - $($i.ExePath)"
              }

          }

      - name: Instances
        shell: pwsh
        run: |
          # Convert JSON string to object array
          $servers = ${{ vars.IISINSTANCE }} | ConvertFrom-Json

          foreach ($s in $servers) {
              Write-Host "PoolName: $($s.PoolName) - SiteName: $($s.SiteName)  - DeployFolder: $($s.DeployFolder) - BackupFolder: $($s.BackupFolder)"

              $instance = $($s.PoolName)

              Write-Host "One Copy"
              Write-Host $instance
          }
      - name: Formatted Print
        run: |
          Write-Host "Normal text"
          Write-Output "::notice title=Deploy Message::Deployment started for MyService"
          Write-Output "::warning title=Deploy Warning::Some optional components were skipped."
          Write-Output "::error title=Deploy Failed::Failed to copy files due to locked DLLs."


      